{% if page.github_url or page.demo_url or page.app_url %}
<div class="project-links" style="margin-bottom: 20px; margin-top: 10px;">
  {% if page.github_url %}
  <a href="{{ page.github_url }}" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 8px 16px; margin-right: 10px; margin-bottom: 10px; background-color: #24292e; color: white; text-decoration: none; border-radius: 5px; font-weight: 500;">
    <i class="fab fa-github"></i> GitHub
  </a>
  {% endif %}

  {% if page.demo_url %}
  <a href="{{ page.demo_url }}" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 8px 16px; margin-right: 10px; margin-bottom: 10px; background-color: #0066cc; color: white; text-decoration: none; border-radius: 5px; font-weight: 500;">
    <i class="fas fa-external-link-alt"></i> Live Demo
  </a>
  {% endif %}

  {% if page.app_url %}
  <a href="{{ page.app_url }}" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 8px 16px; margin-bottom: 10px; background-color: #5856d6; color: white; text-decoration: none; border-radius: 5px; font-weight: 500;">
    <i class="fas fa-mobile-alt"></i> Download App
  </a>
  {% endif %}
</div>
{% endif %}
